substitutions:
  name: jp-jukebox-turntable
  friendly_name: JP Jukebox Turntable
  static_ip: 192.168.1.20

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.5.0
  name_add_mac_suffix: false
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"  
    board_build.flash_mode: dio
    board_build.f_flash: 40000000L
    board_build.flash_size: 4MB

esp32:
  variant: esp32s3
  flash_size: 4MB
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32_S3_BOX_BOARD: "y"
      COMPILER_OPTIMIZATION_SIZE: "y"
    advanced:
      ignore_efuse_mac_crc: false

psram:
  mode: quad
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: ${static_ip}
    gateway: 192.168.1.1
    subnet: 255.255.255.0
  ap:
    password: !secret wifi_ap_password

api:
#   encryption:
#     key: !secret api_key

ota:
  - platform: esphome
    # password: !secret ota_password

captive_portal:

logger:
  hardware_uart: USB_CDC

# VBAN external component
external_components:
  - source:
      type: git
      url: https://github.com/TheEris/Esphome-VBAN
      ref: main
    components: [ vban_audio ]

# I²S bus — PCM1808 ADC as input
i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO7
    i2s_mclk_pin: GPIO11

# PCM1808 as microphone source
microphone:
  - platform: i2s_audio
    id: turntable_mic
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO8
    adc_type: external
    sample_rate: 48000
    pdm: false
    bits_per_sample: 16bit
    mclk_multiple: 384
    channel: stereo

# VBAN transmitter
vban_audio:
  id: vban_tx
  microphone: turntable_mic
  ip_address: !secret ma_server_ip
  port: 6980
  stream_name: turntable
  sample_rate: 48000
  gain: 1.0

# Switch to start/stop streaming
switch:
  - platform: template
    name: "Turntable Stream"
    id: turntable_stream    
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - microphone.capture:
    on_turn_off:
      then:
        - microphone.stop_capture:


# Gain control from HA
number:
  - platform: template
    id: turntable_gain
    name: "Turntable Gain"
    optimistic: true
    min_value: 0.5
    max_value: 3.0
    step: 0.1
    initial_value: 1.0
    on_value:
      then:
        - lambda: 'id(vban_tx).set_gain(float(x));'